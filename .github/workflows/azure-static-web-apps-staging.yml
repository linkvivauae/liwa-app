name: Deploy staging to Azure Static Web Apps

on:
  push:
    branches: [staging]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # app.json sets experiments.baseUrl to /liwa-app so the GitHub Pages
      # build resolves assets under its subpath. Azure serves from the domain
      # root, so clear it for this build only. app.json itself is never
      # committed with this change.
      - name: Clear baseUrl for root-served hosting
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            if (app.expo?.experiments?.baseUrl !== undefined) {
              delete app.expo.experiments.baseUrl;
              fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
              console.log('Cleared experiments.baseUrl for the staging build.');
            } else {
              console.log('No experiments.baseUrl set, nothing to clear.');
            }
          "

      - name: Export static web build
        run: npx expo export --platform web

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Tear down preview environment
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          action: close
